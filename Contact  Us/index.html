<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!---Link fontawesome icons link here-->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h1>Get in touch</h1>
            <p>Fill out the form below to contact us</p>

            <form>
                <div class="input-group">
                    
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Name" required>
                    </div>

                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" placeholder="Email" required>
                    </div>

                    <div class="input-field">
                        <i class="fas fa-phone"></i>
                        <input type="tel" placeholder="Phone (optional)" required>
                    </div>

                    <div class="input-field">
                        <i class="fas fa-tag"></i>
                        <input type="tel" placeholder="Subject" required>
                    </div>

                    
                </div>
                    <div class="message-field">
                        <i class="fas fa-message"></i>
                        <textarea placeholder="Your message" required></textarea>
                    </div>      

                    <button type="submit">
                        <div class="btn-content">
                            <span>Send Message</span>
                        </div>
                    </button>
            </form>

            <div class="contact-info">

                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>123 Molyko, Buea SW Cameroon</span>
                </div>

                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <span>e.juspine@gmail.com</span>
                </div>
                
                <div class="info-item">
                    <i class="fas fa-phone"></i>
                    <span>+237652564253</span>
                </div>

            </div>
        </div>

    </div>
    
</body>
</html>
