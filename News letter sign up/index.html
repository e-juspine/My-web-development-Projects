<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New letter sign up</title>

    <!-- ==========fontawesome link for fonts and icons===========-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup-container">
        <div class="icon-container">
            <i class="far fa-envelope-open"></i>
        </div>
        <h2>Join Our Newsletter</h2>
        <p>Get the lates updates and coding tips straight to your inbox.</p>

        <form>
         <div class="input-group">
          <i class="far fa-envelope"></i>
          <input type="email" placeholder="Enter your email" required>
         </div>

         <button>Subscribe <i class="fas fa-arrow-right"></i></button>
        </form>

        <div class="benefits">
            <p class="benefit-item">
                <i class="fas fa-check"></i> Weekly coding tips
            </p>
            <p class="benefit-item">
                <i class="fas fa-check"></i> No spam, unsubscribe anytime
            </p>
        </div>

    </div>
    
</body>
</html>
